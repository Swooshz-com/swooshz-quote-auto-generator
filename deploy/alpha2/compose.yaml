# Application image source: 4586421715cbb21a7ef36039abce81097eadbfc1
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:6a67277c2f8519cd15db88f4db196ba0aa53fa19c52fa87145f898a7092a4a31"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

# Application image source: 7384901397e63407783c60f6656499db9edf6b12
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:9c96ff9243729847402bc3e91ff1611ab122989e7e7a09e37b9738198fb0b61b"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

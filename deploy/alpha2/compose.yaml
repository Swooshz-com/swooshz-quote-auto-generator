# Application image source: 769b2b9ba6ae6b0e8ceb3cd34cd630f6250f4be7
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:db4a82ac7e48bce28bdfb6498902a8bd6fa72fc560cae81e0c29ba61bc2cf4a4"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

# Application image source: 7872bba3a495aee67a7be151c6ade73e0c04cc09
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:62810fd50fa48598618857b04914bc81fa66e8665121b68e5097dd2b125bfc0e"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

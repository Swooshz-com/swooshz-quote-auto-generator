# Application image source: 9fcf01ee7dd6de2bd68a55fecfec82cce4c0abcd
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:03b2a93ea765ae91601685dc2cb5b01057095fb2a6deb4653aa70beb17ffe157"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

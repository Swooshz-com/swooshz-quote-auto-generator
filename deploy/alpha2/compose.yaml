# Application image source: a65be0e405a3bec469e4002b43a9ac4d7fb0edd8
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:e0711e8629b15f4caa9f3fc758783d0257c4c3d4fc0919b32839d80eca76d0a7"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

# Application image source: 0b5fa49ec45b2785d4e48955cce048a18ce948bb
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:28dea41919d3b766d105a6c751166e68fd3e295ff17c0069b7a409d06be0f789"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

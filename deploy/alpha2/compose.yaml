# Application image source: cdf0d1df043a3fb16663c4f80493d791bbe66dab
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:54fc3983db9ce6b8c0ee218857afb6f2af40f14a709235a2bd6572b10b32decf"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

# Application image source: 41d3294cc782bf60841fb338e70d17375b001394
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:f9161b5003b29eb693e88e36caa15cdda2982f5a4d9e08eb0fc74b8761c144a1"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

# Application image source: 9937bdf2a7e8e0ed864f7d587c2726bc43af02fb
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:bef5b54589937ca252d50f08a5fcc6fe7a260ac0f754900cc0f692f955b4cfc5"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

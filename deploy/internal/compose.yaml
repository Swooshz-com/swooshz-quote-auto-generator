# Application image source: cd98694e189e46a53b64e2b3ae81c09cc7a3589a
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:bc0044f628bd7e5a94c235d5745818ef2060a55c1476308b5ea1d9a2477bc5e9"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

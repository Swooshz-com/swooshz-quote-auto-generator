# Application image source: f43c0b97cdcbeb16d7456516faa394c6ac7f3da1
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:1045198206e5f0d3e49a301a4647ee8b4185e421476672046479310515e80863"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

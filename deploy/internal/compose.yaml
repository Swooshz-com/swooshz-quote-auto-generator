# Application image source: 3fdecf91a1a07e28386abb891eaff882e0e94cee
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:f9767b6edce196ea672e4235dbb485a378bb135ead953681c80e8c4200d3049f"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

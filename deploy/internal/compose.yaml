# Application image source: fd31003fb56f1457109e84ad17c99424b13ddb94
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:7b39b434b6199b69858be02c9acd01bd40840f0733206d33774af5dbd03498c8"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

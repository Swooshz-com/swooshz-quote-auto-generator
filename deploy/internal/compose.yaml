# Application image source: 8c1d38336189646e488b1bd2c6272c4e3513a79c
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:9245e742855d8a7a4e0c8ffc901dd0f8aeb89352abca43ac5f5432e28824d6f5"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

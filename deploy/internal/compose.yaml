# Application image source: 64ad85a015c0f37d60247ce106182cb30e0516ff
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:c3756d880cb252dfb5a877481d0b0e98c24617ab9e00efde2a18bdd98730fd8a"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

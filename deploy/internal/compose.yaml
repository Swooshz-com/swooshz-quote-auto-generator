# Application image source: a004323c7405ecf1f4b134bccc9199e566293667
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:4e05d01d841f13bf5659ae11064e464940828143496b94a4c800d33b15f39e26"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

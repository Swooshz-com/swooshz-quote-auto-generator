# Application image source: df0b8877eaca2563d8d32d2734fca939b6c81fec
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:574395083de57c7dc650c5d6643f696d5cb6f6915030aef0896d5316fb32f883"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

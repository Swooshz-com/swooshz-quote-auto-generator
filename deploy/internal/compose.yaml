# Application image source: 9cc037a7a341d79d725124e1b9f4928d812c1df5
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:c1791d3fb4c920d82d54200dd2692769e62c6f251c85f801ecfa681efcfc1097"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

# Application image source: 166ebbddf78921d36c705d2fdd111107fd7de57c
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:548aaab8e74b1b1e579752fe22051831b578c79d8e445ff82acaab4a839739d7"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

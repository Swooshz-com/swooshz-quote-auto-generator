# Application image source: 83309d983464008c88a405007f8eeed05ab402c8
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:1e65c7570e7ad7c6411f09c56588291a53292d3539841a0e2f246c4ff877cfd3"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

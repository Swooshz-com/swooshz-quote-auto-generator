# Application image source: 4a88bc81fa50731cb451d2a7925e2ec20188bae9
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:308865f1bee9e6f7721e86f06d8b18db43556d5a327f409fee1075188fe0e383"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

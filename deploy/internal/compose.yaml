# Application image source: 22bca3517648c346fa8651533b370d97f954234e
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:80b9b26a86b624be1affda692f68f74031c7ba50126436d560a6c57376b47c57"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

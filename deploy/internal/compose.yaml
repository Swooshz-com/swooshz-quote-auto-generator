# Application image source: 918051836a92c3ad2314a2eb4cf06d8678eda1a4
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:408815dcebe35de22af1ee030d99c4c10fc257d70972f83048fd744fcca02e86"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

# Application image source: d07c910a5180cc918a17010cccbd800776f0b06a
# Coolify supplies the runtime environment file and proxy routing.
services:
  quote-internal:
    image: "sha256:c0d25407252d79ad53d3fb86324766c3e3759c443f5385cf2c192d62c28d7c27"
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X 'GET' -f 'http://localhost:8765/api/health' > /dev/null || wget -q -O- 'http://localhost:8765/api/health' > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

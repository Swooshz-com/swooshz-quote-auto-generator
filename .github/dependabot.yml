version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      aws-sdk-patch-and-minor:
        patterns: ["boto3", "botocore"]
        update-types: ["patch", "minor"]
      pip-patch-and-minor:
        patterns: ["*"]
        exclude-patterns: ["boto3", "botocore"]
        update-types: ["patch", "minor"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions-patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      npm-patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]

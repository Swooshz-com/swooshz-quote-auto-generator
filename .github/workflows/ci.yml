name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrospective_exact_starting_head_red:
    name: Retrospective fixture integrity and RED reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact workflow head binding
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Run immutable repository-contained retrospective fixture
        run: python scripts/reproduce_run34_red.py

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            git --verbose --redact .

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Audit Node dependencies
        run: npm audit --audit-level=high

  validate:
    name: Validate app
    runs-on: ubuntu-latest
    needs:
      - retrospective_exact_starting_head_red
      - secret-scan
      - dependency-audit
    if: always() && needs.retrospective_exact_starting_head_red.result == 'success' && needs.secret-scan.result == 'success' && needs.dependency-audit.result == 'success'
    env:
      APP_MODE: local
      LOCAL_USER_ROLE: admin
      CI: "true"
      SQAG_TEST_POSTGRES_HOST: 127.0.0.1
      SQAG_TEST_POSTGRES_PORT: "5432"
      SQAG_TEST_POSTGRES_USER: postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install --only-binary=:all: pip-audit==2.9.0

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt --strict

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Assert disposable PostgreSQL service is major version 17
        run: python scripts/assert_postgres17.py

      - name: Check JavaScript syntax
        run: |
          node --check webapp/static/app.js
          node --check scripts/playwright-smoke.mjs
          node --check scripts/playwright-ai-basis-chat-stress.mjs
          node --check scripts/playwright-internal-google-auth.mjs

      - name: Check Python syntax
        run: |
          python -m py_compile webapp/server.py webapp/internal_google_auth.py webapp/postgres_migrations.py tests/internal_google_browser_harness.py tests/test_runtime_privilege_contract.py scripts/migrate_sqag_storage.py scripts/preflight_sqag_migrations.py scripts/generate_quote.py scripts/live_ai_basis_chat_smoke.py scripts/build_pricing_catalog.py scripts/pricing_reference_cleanup.py scripts/pricing_reference_enrichment.py scripts/validate_dynamic_pricing_reference_rules.py scripts/validate_local_pdf_dependency_usage.py scripts/validate_runtime_privilege_contract.py scripts/assert_postgres17.py

      - name: Guard local PDF dependency usage
        run: python scripts/validate_local_pdf_dependency_usage.py

      - name: Guard dynamic pricing reference rules
        run: python scripts/validate_dynamic_pricing_reference_rules.py

      - name: Guard sensitive fixtures
        run: python scripts/scan_sensitive_fixtures.py --fail-on-review

      - name: Validate runtime privilege contract
        run: python scripts/validate_runtime_privilege_contract.py

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Run AI basis chat stress smoke
        run: npm run playwright:ai-stress

      - name: Run synthetic internal Google auth smoke
        run: npm run playwright:internal-auth

      - name: Run app smoke test
        run: npm run playwright:smoke
